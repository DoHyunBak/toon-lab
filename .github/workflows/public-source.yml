name: Public source boundary and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-21
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified 2026-10-21
        with:
          python-version: ${{ matrix.python }}
      - name: Check tracked payload and export
        env:
          PUBLIC_OUTPUT: ${{ runner.temp }}/toon_lab-public
          PUBLIC_ARCHIVE: ${{ runner.temp }}/toon_lab-source.zip
        run: |
          python tools/public_release.py check --staged
          python tools/public_release.py export --output-dir "$PUBLIC_OUTPUT" --zip "$PUBLIC_ARCHIVE"
          python tools/public_release.py verify-zip "$PUBLIC_ARCHIVE"
      - name: Install public dependencies and test isolated export
        env:
          PUBLIC_OUTPUT: ${{ runner.temp }}/toon_lab-public
        run: |
          cd "$PUBLIC_OUTPUT"
          python -m pip install -r requirements.txt
          python tools/setup_open_fonts.py
          python -m unittest discover -s tests
          python tools/public_release.py check
      - name: Audit declared runtime dependencies
        env:
          PUBLIC_OUTPUT: ${{ runner.temp }}/toon_lab-public
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r "$PUBLIC_OUTPUT/requirements.txt" --disable-pip --no-deps
